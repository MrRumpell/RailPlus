<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">RailPlus</title>
  <desc id="desc">A Y-shaped diagonal rail switch in steel and dark wood, with a brass plus accent and the RailPlus wordmark.</desc>

  <defs>
    <clipPath id="card">
      <rect width="1024" height="1024" rx="176"/>
    </clipPath>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#202d34"/>
      <stop offset="0.55" stop-color="#162027"/>
      <stop offset="1" stop-color="#0c1216"/>
    </linearGradient>

    <radialGradient id="ambient" cx="50%" cy="36%" r="58%">
      <stop offset="0" stop-color="#6e8b97" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#2e4652" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="vignette" cx="50%" cy="45%" r="72%">
      <stop offset="0.55" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.42"/>
    </radialGradient>

    <linearGradient id="steel" x1="0" y1="240" x2="0" y2="760" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eef5f7"/>
      <stop offset="0.28" stop-color="#c8d2d7"/>
      <stop offset="0.62" stop-color="#9eabb2"/>
      <stop offset="1" stop-color="#74838b"/>
    </linearGradient>

    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#815737"/>
      <stop offset="0.42" stop-color="#634126"/>
      <stop offset="1" stop-color="#402817"/>
    </linearGradient>

    <linearGradient id="brass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0c66c"/>
      <stop offset="0.48" stop-color="#d6a64a"/>
      <stop offset="1" stop-color="#a8772e"/>
    </linearGradient>

    <pattern id="trackLines" width="64" height="64" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <path d="M0 16H64 M0 48H64" fill="none" stroke="#dce9ee" stroke-opacity="0.035" stroke-width="2"/>
    </pattern>

  </defs>

  <!-- Badge -->
  <rect width="1024" height="1024" rx="176" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="1024" height="1024" fill="url(#trackLines)"/>
    <rect width="1024" height="1024" fill="url(#ambient)"/>
    <rect width="1024" height="1024" fill="url(#vignette)"/>
  </g>

  <!-- Frame -->
  <rect x="14" y="14" width="996" height="996" rx="164" fill="none" stroke="#42545e" stroke-width="3"/>
  <rect x="29" y="29" width="966" height="966" rx="151" fill="none" stroke="#b98a42" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Y switch: sleepers sit behind the rails -->
  <g fill="url(#wood)" stroke="#2a1a10" stroke-width="2">
    <!-- Stem sleepers -->
    <rect x="417" y="691" width="190" height="18" rx="3"/>
    <rect x="417" y="631" width="190" height="18" rx="3"/>
    <rect x="417" y="571" width="190" height="18" rx="3"/>
    <rect x="417" y="511" width="190" height="18" rx="3"/>

    <!-- Left branch sleepers -->
    <g transform="translate(472.4 430.4) rotate(-45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(419.6 377.6) rotate(-45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(366.8 324.8) rotate(-45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(318.4 276.4) rotate(-45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>

    <!-- Right branch sleepers -->
    <g transform="translate(551.6 430.4) rotate(45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(604.4 377.6) rotate(45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(657.2 324.8) rotate(45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
    <g transform="translate(705.6 276.4) rotate(45)">
      <rect x="-95" y="-9" width="190" height="18" rx="3"/>
    </g>
  </g>

  <!-- Y switch: twin steel rails with a dark center groove -->
  <g fill="none" stroke-linecap="butt" stroke-linejoin="miter">
    <g stroke="#070b0e" stroke-width="102">
      <path d="M512 740V470"/>
      <path d="M512 470L300 258"/>
      <path d="M512 470L724 258"/>
    </g>
    <g stroke="url(#steel)" stroke-width="76">
      <path d="M512 740V470"/>
      <path d="M512 470L300 258"/>
      <path d="M512 470L724 258"/>
    </g>
    <g stroke="#1a252b" stroke-width="20">
      <path d="M512 740V470"/>
      <path d="M512 470L300 258"/>
      <path d="M512 470L724 258"/>
    </g>
  </g>

  <!-- Rail end caps -->
  <g fill="none" stroke="#d7e0e4" stroke-opacity="0.72" stroke-width="5" stroke-linecap="round">
    <path d="M474 740H550"/>
    <path d="M278 280L300 258"/>
    <path d="M702 280L724 258"/>
  </g>

  <!-- Rail-tie separator -->
  <rect x="292" y="780" width="440" height="2" fill="#3b4c55"/>

  <!-- Wordmark -->
  <text x="512" y="908" text-anchor="middle"
        font-family="'DejaVu Sans Condensed', 'Liberation Sans Narrow', sans-serif"
        font-size="142" font-weight="700" letter-spacing="1">
    <tspan fill="#eef4f6">RAIL</tspan><tspan fill="#d6a64a">PLUS</tspan>
  </text>

  <!-- Tagline -->
  <text x="512" y="980" text-anchor="middle"
        font-family="'DejaVu Sans', 'Liberation Sans', sans-serif"
        font-size="27" font-weight="600" letter-spacing="10" fill="#8fa1a9">
    DIAGONAL RAILS
  </text>
</svg>
